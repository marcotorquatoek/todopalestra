<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zaino">
<title>Zaino Palestra</title>
<style>
:root{--bg:#f5f5f5;--surface:#fff;--surface2:#fafafa;--border:#e0e0e0;--text:#212121;--text2:#757575;--accent:#FF6D00;--accent2:#FF3D00;--check:#43A047;--shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1e1e1e;--surface2:#2a2a2a;--border:#333;--text:#eee;--text2:#9e9e9e;--shadow:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--surface:#1e1e1e;--surface2:#2a2a2a;--border:#333;--text:#eee;--text2:#9e9e9e;--shadow:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.title{font-size:20px;font-weight:700}
.hactions{display:flex;gap:6px}
.ibtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:36px;height:36px;padding:0 10px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:13px;font-weight:500}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.progress{height:6px;background:var(--border);border-radius:99px;margin:4px 0 4px;overflow:hidden}
.progress>div{height:100%;background:var(--check);width:0;transition:width .25s}
.pcount{font-size:12px;color:var(--text2);margin-bottom:16px;text-align:right}
.section{margin-bottom:22px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.stitle{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase}
.stitle small{color:var(--text2);font-weight:500;letter-spacing:0;margin-left:6px}
.sbtns{display:flex;gap:6px}
.abtn{font-size:11px;font-weight:500;color:var(--text2);background:none;border:1px solid var(--border);padding:3px 8px;border-radius:6px}
.abtn:active{color:var(--accent2);border-color:var(--accent2)}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.item{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);gap:10px;user-select:none;cursor:pointer}
.item:last-child{border-bottom:none}
.item:active{background:var(--surface2)}
.cb{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;line-height:1}
.item.done .cb{background:var(--check);border-color:var(--check)}
.item.done .cb::after{content:"✓"}
.label{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
.item.done .label{color:var(--text2);text-decoration:line-through}
.erow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border)}
.erow:last-child{border-bottom:none}
.einput{flex:1;background:transparent;border:none;outline:none;color:var(--text);padding:6px 2px;min-width:0}
.einput:focus{color:var(--accent)}
.sname{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.mini{background:none;border:none;color:var(--text2);font-size:16px;width:28px;height:28px;border-radius:6px}
.mini:active{color:var(--accent2)}
.addrow{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface2);border-top:1px dashed var(--border)}
.addbtn{background:var(--accent);color:#fff;border:none;border-radius:6px;width:28px;height:28px;font-size:18px;flex-shrink:0}
.newsec{display:flex;gap:8px;margin-top:6px;padding:10px 12px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:10px}
.empty{padding:14px;font-size:13px;color:var(--text2);font-style:italic}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.dlg{background:var(--surface);border-radius:var(--radius);padding:20px;max-width:340px;width:100%}
.dlg h3{margin-bottom:8px;font-size:16px}.dlg p{font-size:14px;color:var(--text2);margin-bottom:16px}
.dbtns{display:flex;gap:8px;justify-content:flex-end}
.dbtns button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}
.dbtns .ok{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🎒 Zaino Palestra</div>
    <div class="hactions">
      <button class="ibtn" id="editBtn" onclick="toggleEdit()">Modifica</button>
      <button class="ibtn" onclick="resetAll()" title="Svuota tutti i check">↺ Reset</button>
      <button class="ibtn" onclick="toggleTheme()" title="Tema">◐</button>
    </div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="pcount" id="pcount"></div>
  <div id="root"></div>
  <div id="newSecWrap"></div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="ov"><div class="dlg"><h3 id="dt"></h3><p id="db"></p><div class="dbtns"><button onclick="closeDlg()">Annulla</button><button class="ok" id="dok">Conferma</button></div></div></div>

<script>
const KEY='zaino-palestra-v1';
const DEFAULT=[
 {id:'s1',name:'Generale',items:['Acqua','Pantaloni serata','T-shirt serata','Cintura','Scarpe da ballo','Phon','Merendina']},
 {id:'s2',name:'Beauty',items:['Profumo','Deodorante','Spazzola','Polvere','Dentifricio','Spazzolino']},
 {id:'s3',name:'Doccia',items:['Accappatoio','Bagnoschiuma','Shampoo','Ciabatte','Tappetino','Mutande','Calze']},
 {id:'s4',name:'Workout addosso',items:['Scarpe da palestra','Asciugamano da palestra','Maglietta','Pantaloncini / Pantaloni lunghi']},
 {id:'s5',name:'Sacchetta blu',items:['Fazzoletti','Cicca','Chiavi ingresso','Lucchetto']}
];
let uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let state=load(), editing=false;
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const p=JSON.parse(r); if(Array.isArray(p))return p;}}catch(e){}
  return DEFAULT.map(s=>({id:s.id,name:s.name,items:s.items.map(l=>({id:uid(),label:l,checked:false}))}));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

function render(){
  const root=document.getElementById('root'); let html='',tot=0,done=0;
  state.forEach((s,si)=>{
    const d=s.items.filter(i=>i.checked).length; tot+=s.items.length; done+=d;
    if(!editing){
      html+=`<div class="section"><div class="shead"><div class="stitle">${esc(s.name)}<small>${d}/${s.items.length}</small></div>
      <div class="sbtns"><button class="abbtn abtn" onclick="clearSec(${si})">Svuota</button></div></div><div class="card">`+
      (s.items.length?s.items.map((it,ii)=>`<div class="item ${it.checked?'done':''}" onclick="tog(${si},${ii})"><div class="cb"></div><div class="label">${esc(it.label)}</div></div>`).join(''):'<div class="empty">Nessuna voce</div>')+
      `</div></div>`;
    }else{
      html+=`<div class="section"><div class="shead"><input class="einput sname" value="${esc(s.name)}" onchange="renSec(${si},this.value)">
      <div class="sbtns"><button class="mini" onclick="moveSec(${si},-1)">↑</button><button class="mini" onclick="moveSec(${si},1)">↓</button><button class="mini" onclick="delSec(${si})">🗑</button></div></div><div class="card">`+
      s.items.map((it,ii)=>`<div class="erow"><input class="einput" value="${esc(it.label)}" onchange="renItem(${si},${ii},this.value)"><button class="mini" onclick="moveItem(${si},${ii},-1)">↑</button><button class="mini" onclick="moveItem(${si},${ii},1)">↓</button><button class="mini" onclick="delItem(${si},${ii})">✕</button></div>`).join('')+
      `<div class="addrow"><input class="einput" id="add${si}" placeholder="Nuova voce…" onkeydown="if(event.key==='Enter')addItem(${si})"><button class="addbtn" onclick="addItem(${si})">+</button></div></div></div>`;
    }
  });
  root.innerHTML=html;
  document.getElementById('newSecWrap').innerHTML=editing?`<div class="newsec"><input class="einput" id="newSec" placeholder="Nuova sezione…" onkeydown="if(event.key==='Enter')addSec()"><button class="addbtn" onclick="addSec()">+</button></div>`:'';
  document.getElementById('bar').style.width=(tot?done/tot*100:0)+'%';
  document.getElementById('pcount').textContent=editing?'Modalità modifica':(done+' / '+tot+(tot&&done===tot?' · Zaino pronto! 🎉':''));
  const b=document.getElementById('editBtn'); b.textContent=editing?'Fatto':'Modifica'; b.classList.toggle('on',editing);
}
function tog(s,i){state[s].items[i].checked=!state[s].items[i].checked;save();render()}
function clearSec(s){state[s].items.forEach(i=>i.checked=false);save();render()}
function toggleEdit(){editing=!editing;render();window.scrollTo(0,0)}
function renSec(s,v){v=v.trim();if(v){state[s].name=v;save()}else render()}
function renItem(s,i,v){v=v.trim();if(v){state[s].items[i].label=v;save()}else render()}
function addItem(s){const inp=document.getElementById('add'+s);const v=inp.value.trim();if(!v)return;state[s].items.push({id:uid(),label:v,checked:false});save();render();const n=document.getElementById('add'+s);n&&n.focus()}
function delItem(s,i){state[s].items.splice(i,1);save();render()}
function moveItem(s,i,d){const a=state[s].items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function addSec(){const inp=document.getElementById('newSec');const v=inp.value.trim();if(!v)return;state.push({id:uid(),name:v,items:[]});save();render();toast('Sezione aggiunta')}
function moveSec(s,d){const j=s+d;if(j<0||j>=state.length)return;[state[s],state[j]]=[state[j],state[s]];save();render()}
function delSec(s){dlg('Elimina sezione','Eliminare "'+state[s].name+'" con tutte le sue voci?',()=>{state.splice(s,1);save();render()})}
function resetAll(){dlg('Svuota tutto','Togliere tutti i check da tutte le sezioni?',()=>{state.forEach(s=>s.items.forEach(i=>i.checked=false));save();render();toast('Zaino azzerato')})}
function dlg(t,b,fn){document.getElementById('dt').textContent=t;document.getElementById('db').textContent=b;document.getElementById('dok').onclick=()=>{closeDlg();fn()};document.getElementById('ov').classList.add('show')}
function closeDlg(){document.getElementById('ov').classList.remove('show')}
function toggleTheme(){
  const r=document.documentElement;const dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const n=dark?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem(KEY+'-theme',n)}catch(e){}
}
try{const t=localStorage.getItem(KEY+'-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
render();
</script>
</body>
</html>
