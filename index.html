<title>Zaino Palestra</title>
<style>
:root{--bg:#f5f5f5;--surface:#fff;--surface2:#fafafa;--border:#e0e0e0;--text:#212121;--text2:#757575;--accent:#FF6D00;--accent2:#FF3D00;--check:#43A047;--shadow:0 2px 8px rgba(0,0,0,.08);--radius:12px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1e1e1e;--surface2:#2a2a2a;--border:#333;--text:#eee;--text2:#9e9e9e;--shadow:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--surface:#1e1e1e;--surface2:#2a2a2a;--border:#333;--text:#eee;--text2:#9e9e9e;--shadow:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
.app{max-width:560px;margin:0 auto;padding:10px 10px 30px}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.title{font-size:18px;font-weight:700}
.hactions{display:flex;gap:6px}
.ibtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:34px;height:34px;padding:0 10px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:13px;font-weight:500}
.ibtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.progress{height:5px;background:var(--border);border-radius:99px;margin:2px 2px 4px;overflow:hidden}
.progress>div{height:100%;background:var(--check);width:0;transition:width .25s}
.pcount{font-size:12px;color:var(--text2);margin:0 2px 10px;text-align:right}
/* due colonne in visualizzazione */
.cols{column-count:2;column-gap:10px}
.cols .section{break-inside:avoid;margin-bottom:10px}
.section{margin-bottom:14px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:6px}
.stitle{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;line-height:1.2}
.stitle small{color:var(--text2);font-weight:500;letter-spacing:0;margin-left:4px}
.abtn{font-size:10px;color:var(--text2);background:none;border:1px solid var(--border);padding:2px 6px;border-radius:6px}
.card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.item{display:flex;align-items:center;padding:9px 8px;border-bottom:1px solid var(--border);gap:7px;user-select:none;cursor:pointer}
.item:last-child{border-bottom:none}
.item:active{background:var(--surface2)}
.cb{width:17px;height:17px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1}
.item.done .cb{background:var(--check);border-color:var(--check)}
.item.done .cb::after{content:"✓"}
.item.fixed .cb{background:#bdbdbd;border-color:#bdbdbd}
.item.fixed .cb::after{content:"✓"}
.item.fixed.done .cb{background:var(--check);border-color:var(--check)}
.item.fixed:not(.done) .label{color:var(--text)}
.badge{flex-shrink:0;min-width:18px;height:18px;border-radius:99px;background:#FFC107;color:#3a2a00;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tag{width:30px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);font-size:14px;padding:0}
.erow .mini{width:24px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text2);margin:0 2px 8px}
.label{flex:1;font-size:13px;line-height:1.25;word-break:break-word}
.item.done .label{color:var(--text2);text-decoration:line-through}
.empty{padding:10px;font-size:12px;color:var(--text2);font-style:italic}
/* modifica */
.erow{display:flex;align-items:center;gap:2px;padding:4px 6px;border-bottom:1px solid var(--border)}
.erow:last-child{border-bottom:none}
.einput{flex:1;background:transparent;border:none;outline:none;color:var(--text);padding:6px 2px;min-width:0}
.einput:focus{color:var(--accent)}
.sname{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.mini{background:none;border:none;color:var(--text2);font-size:16px;width:28px;height:30px;border-radius:6px;flex-shrink:0}
.mini:active{color:var(--accent2)}
.mv{width:34px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);font-size:16px!important;padding:0 2px;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center}
.addrow{display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--surface2);border-top:1px dashed var(--border)}
.addbtn{background:var(--accent);color:#fff;border:none;border-radius:6px;width:30px;height:30px;font-size:18px;flex-shrink:0}
.newsec{display:flex;gap:8px;margin-top:6px;padding:8px 10px;background:var(--surface);border:1.5px dashed var(--accent);border-radius:10px}
.hint{font-size:12px;color:var(--text2);margin:0 2px 10px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.dlg{background:var(--surface);border-radius:var(--radius);padding:20px;max-width:340px;width:100%}
.dlg h3{margin-bottom:8px;font-size:16px}.dlg p{font-size:14px;color:var(--text2);margin-bottom:16px}
.dbtns{display:flex;gap:8px;justify-content:flex-end}
.dbtns button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px}
.dbtns .ok{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">🎒 Zaino Palestra</div>
    <div class="hactions">
      <button class="ibtn" id="editBtn" onclick="toggleEdit()">Modifica</button>
      <button class="ibtn" onclick="resetAll()">↺</button>
      <button class="ibtn" onclick="toggleTheme()">◐</button>
    </div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="pcount" id="pcount"></div>
  <div id="hint"></div>
  <div id="root"></div>
  <div id="newSecWrap"></div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="ov"><div class="dlg"><h3 id="dt"></h3><p id="db"></p><div class="dbtns"><button onclick="closeDlg()">Annulla</button><button class="ok" id="dok">Conferma</button></div></div></div>

<script>
const KEY='zaino-palestra-v1';
const DEFAULT=[
 {id:'s1',name:'Generale',items:['Acqua','Merendina']},
 {id:'s2',name:'Beauty',items:['Profumo','Deodorante','Spazzola','Polvere',['Dentifricio','fixed'],['Spazzolino','fixed']]},
 {id:'s3',name:'Doccia',items:['Mutande','Calze','Accappatoio',['Bagnoschiuma','fixed'],['Shampoo','fixed'],['Ciabatte','fixed'],['Tappetino','fixed'],['Phon','fixed']]},
 {id:'s4',name:'Workout',items:[['Scarpe da palestra','quick'],['Asciugamano da palestra','quick'],['Maglietta allenamento','quick'],['Pantaloni allenamento','quick']]},
 {id:'s5',name:'Sacchetta blu',items:[['Fazzoletti','fixed'],['Cicche','fixed'],['Chiavi ingresso','fixed'],['Lucchetto','fixed'],['Versa Grip','fixed']]},
 {id:'s6',name:'Post doccia',items:[['T-shirt di ricambio','quick'],['Pantaloni o tuta ricambio','quick'],'Scarpe da ballo','Cintura']}
];
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let state=load(), editing=false;
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const p=JSON.parse(r); if(Array.isArray(p))return p;}}catch(e){}
  return DEFAULT.map(s=>({id:s.id,name:s.name,items:s.items.map(l=>{const a=Array.isArray(l)?l:[l];const o={id:uid(),label:a[0],checked:false};if(a[1])o.type=a[1];return o})}));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

function render(){
  const root=document.getElementById('root'); let html='',tot=0,done=0,q=0;
  state.forEach((s,si)=>{
    const d=s.items.filter(i=>i.checked).length; tot+=s.items.length; done+=d;
    if(!editing){
      html+=`<div class="section"><div class="shead"><div class="stitle">${esc(s.name)}<small>${d}/${s.items.length}</small></div>
      <button class="abtn" onclick="clearSec(${si})">Svuota</button></div><div class="card">`+
      (s.items.length?s.items.map((it,ii)=>`<div class="item ${it.checked?'done':''} ${it.type==='fixed'?'fixed':''}" onclick="tog(${si},${ii})"><div class="cb"></div><div class="label">${esc(it.label)}</div>${it.type==='quick'?`<span class="badge">${++q}</span>`:''}</div>`).join(''):'<div class="empty">Nessuna voce</div>')+
      `</div></div>`;
    }else{
      const opts=state.map((x,k)=>k===si?'':`<option value="${k}">${esc(x.name)}</option>`).join('');
      html+=`<div class="section"><div class="shead"><input class="einput sname" value="${esc(s.name)}" onchange="renSec(${si},this.value)">
      <button class="mini" onclick="moveSec(${si},-1)">↑</button><button class="mini" onclick="moveSec(${si},1)">↓</button><button class="mini" onclick="delSec(${si})">🗑</button></div><div class="card">`+
      s.items.map((it,ii)=>`<div class="erow"><input class="einput" value="${esc(it.label)}" onchange="renItem(${si},${ii},this.value)">
        <button class="tag" onclick="cycleTag(${si},${ii})">${it.type==='fixed'?'📌':it.type==='quick'?'⚡':'○'}</button><select class="mv" onchange="moveTo(${si},${ii},this.value)" aria-label="Sposta in un'altra categoria"><option value="">⇄</option>${opts}</select>
        <button class="mini" onclick="moveItem(${si},${ii},-1)">↑</button><button class="mini" onclick="moveItem(${si},${ii},1)">↓</button><button class="mini" onclick="delItem(${si},${ii})">✕</button></div>`).join('')+
      `<div class="addrow"><input class="einput" id="add${si}" placeholder="Nuova voce…" onkeydown="if(event.key==='Enter')addItem(${si})"><button class="addbtn" onclick="addItem(${si})">+</button></div></div></div>`;
    }
  });
  root.className=editing?'':'cols';
  root.innerHTML=html;
  document.getElementById('hint').innerHTML=editing?'<div class="hint">⇄ sposta la voce in un’altra categoria, ↑↓ riordina. Tocca il simbolo a sinistra per cambiare tipo: ○ normale · 📌 sempre in borsa (spunta grigia fissa) · ⚡ allenamento veloce (pallino giallo numerato).</div>':'';
  document.getElementById('newSecWrap').innerHTML=editing?`<div class="newsec"><input class="einput" id="newSec" placeholder="＋ Nuova categoria…" onkeydown="if(event.key==='Enter')addSec()"><button class="addbtn" onclick="addSec()">+</button></div>`:'';
  document.getElementById('bar').style.width=(tot?done/tot*100:0)+'%';
  document.getElementById('pcount').textContent=editing?'Modalità modifica':(done+' / '+tot+(tot&&done===tot?' · Zaino pronto! 🎉':''));
  const b=document.getElementById('editBtn'); b.textContent=editing?'Fatto':'Modifica'; b.classList.toggle('on',editing);
}
function tog(s,i){state[s].items[i].checked=!state[s].items[i].checked;save();render()}
function clearSec(s){state[s].items.forEach(i=>i.checked=false);save();render()}
function toggleEdit(){editing=!editing;render();window.scrollTo(0,0)}
function renSec(s,v){v=v.trim();if(v){state[s].name=v;save();render()}else render()}
function renItem(s,i,v){v=v.trim();if(v){state[s].items[i].label=v;save()}else render()}
function addItem(s){const inp=document.getElementById('add'+s);const v=inp.value.trim();if(!v)return;state[s].items.push({id:uid(),label:v,checked:false});save();render();const n=document.getElementById('add'+s);n&&n.focus()}
function delItem(s,i){state[s].items.splice(i,1);save();render()}
function moveItem(s,i,d){const a=state[s].items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function moveTo(s,i,t){if(t==='')return;t=+t;const it=state[s].items.splice(i,1)[0];state[t].items.push(it);save();render();toast('Spostata in '+state[t].name)}
function cycleTag(s,i){const it=state[s].items[i];it.type=it.type==='fixed'?'quick':it.type==='quick'?undefined:'fixed';if(!it.type)delete it.type;save();render()}
function addSec(){const inp=document.getElementById('newSec');const v=inp.value.trim();if(!v)return;state.push({id:uid(),name:v,items:[]});save();render();toast('Categoria aggiunta');const n=document.getElementById('add'+(state.length-1));n&&n.focus()}
function moveSec(s,d){const j=s+d;if(j<0||j>=state.length)return;[state[s],state[j]]=[state[j],state[s]];save();render()}
function delSec(s){dlg('Elimina categoria','Eliminare "'+state[s].name+'" con tutte le sue voci?',()=>{state.splice(s,1);save();render()})}
function resetAll(){dlg('Svuota tutto','Togliere tutti i check da tutte le categorie?',()=>{state.forEach(s=>s.items.forEach(i=>i.checked=false));save();render();toast('Zaino azzerato')})}
function dlg(t,b,fn){document.getElementById('dt').textContent=t;document.getElementById('db').textContent=b;document.getElementById('dok').onclick=()=>{closeDlg();fn()};document.getElementById('ov').classList.add('show')}
function closeDlg(){document.getElementById('ov').classList.remove('show')}
function toggleTheme(){
  const r=document.documentElement;const dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  const n=dark?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem(KEY+'-theme',n)}catch(e){}
}
try{const t=localStorage.getItem(KEY+'-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
render();
</script>
</body>
</html>
